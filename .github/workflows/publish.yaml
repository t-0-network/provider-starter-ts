name: Publish to NPM

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          show-progress: false

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Build
        run: |
          npm i
          npm run build

      - run: npm publish --access public
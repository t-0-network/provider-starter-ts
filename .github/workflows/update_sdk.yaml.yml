name: Update SDK

on:
  repository_dispatch:
    types: [sdk_update]

jobs:
  update_sdk:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub APP Token
        uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: provider-sdk-ts

      - name: Checkout
        uses: actions/checkout@v4
        with:
          show-progress: false
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ github.head_ref }}

      - name: Update SDK
        run: |
          npm install @t-0/provider-sdk@${{ github.event.client_payload.sdkVersion }}

      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'Updated SDK to ${{ github.event.client_payload.sdkVersion }}'

      - name: Trigger release after SDK update
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: ${{ github.repository_owner }}/provider-starter-ts
          event-type: release